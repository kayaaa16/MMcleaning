function editTemplate(id) {
  const t = taskTemplates.find(x => x.id === id);
  if (!t) return;
  openModal({
    title: '編輯任務', name: t.name, count: t.count, showCat: true, preselCat: t.category,
    async onSave({ name, count, cat }) {
      const oldCount = t.count;
      await updateDoc(doc(db, "templates", id), { name, count, category: cat });
      
      const batchChunks = [];
      let currentBatch = writeBatch(db);
      let opCount = 0;
      
      // Update all existing tasks that use this template
      const allTasksToUpdate = [];
      let templateNote = null;
      Object.keys(poolTasksByMonth).forEach(m => {
        poolTasksByMonth[m].forEach(p => { 
          if (p.templateId===id) {
            allTasksToUpdate.push(p.id);
            if (p.note) templateNote = p.note;
          }
        });
      });
      scheduledTasks.forEach(s => { 
        if (s.templateId===id) {
          allTasksToUpdate.push(s.id);
          if (s.note) templateNote = s.note;
        }
      });
      
      allTasksToUpdate.forEach(tid => {
        currentBatch.update(doc(db, "tasks", tid), { name });
        opCount++;
        if(opCount === 400) { batchChunks.push(currentBatch); currentBatch = writeBatch(db); opCount = 0; }
      });
      
      // If count increased, add extra tasks to CURRENT month's pool
      if (count > oldCount) {
        const curKey = fmtMonth(currentDate);
        for (let i=0; i<count-oldCount; i++) {
          const newTask = { name, templateId: id, monthKey: curKey, date: null, status: 'pending' };
          if (templateNote) newTask.note = templateNote;
          currentBatch.set(doc(collection(db, "tasks")), newTask);
          opCount++;
          if(opCount === 400) { batchChunks.push(currentBatch); currentBatch = writeBatch(db); opCount = 0; }
        }
      }
      
      if(opCount > 0) batchChunks.push(currentBatch);
      for(let batch of batchChunks) await batch.commit();
    }
  });
}

/* ══════════════════════════════════════════════
   TASK TOOLTIP LOGIC
══════════════════════════════════════════════ */
let ttEl = null, ttDates = null;

function showTaskTooltip(task, cardEl) {
  if (!ttEl) { ttEl = $('task-tooltip'); ttDates = $('tt-dates'); }
  const ttTitle = $('tt-title');
  if (!task.templateId && !task.name) return;
  
  if (cardEl.classList.contains('c-card')) {
    ttTitle.textContent = '備註內容';
    if (task.note && task.note.trim() !== '') {
      ttDates.innerHTML = '<div class="tt-date-item" style="white-space: pre-wrap; word-break: break-all;"></div>';
      ttDates.querySelector('.tt-date-item').textContent = task.note;
    } else {
      ttDates.innerHTML = '<div class="tt-date-item" style="color: var(--txt3); font-style: italic;">無備註</div>';
    }
  } else {
    ttTitle.textContent = '排定日期';
    const lo = new Date(REAL_TODAY); lo.setDate(REAL_TODAY.getDate() - 21);
    const hi = new Date(REAL_TODAY); hi.setDate(REAL_TODAY.getDate() + 21);

    const matches = scheduledTasks.filter(t => (t.templateId && t.templateId === task.templateId) || (!t.templateId && t.name === task.name))
                                  .filter(t => t.date);

    // 同一天合併成一筆：保留一個日期，記錄當天總數與已完成數
    const byDate = new Map();
    matches.forEach(t => {
      const entry = byDate.get(t.date) || { date: t.date, total: 0, done: 0 };
      entry.total++;
      if (t.status === 'completed') entry.done++;
      byDate.set(t.date, entry);
    });
    const allUnique = [...byDate.values()].sort((a, b) => a.date.localeCompare(b.date));
    const withinUnique = allUnique.filter(e => {
      const d = parseDate(e.date);
      return d >= lo && d <= hi;
    });
    const hiddenDates = allUnique.length - withinUnique.length;

    if (allUnique.length === 0) {
      ttDates.innerHTML = '<div class="tt-date-item">尚未安排日期</div>';
    } else if (withinUnique.length === 0) {
      ttDates.innerHTML = `<div class="tt-date-item" style="color:var(--txt3);font-style:italic;">前後三週內無排定<br>(超出範圍共 ${allUnique.length} 天)</div>`;
    } else {
      let html = withinUnique.map(e => {
        const fullyDone = e.done === e.total;
        const partial = e.done > 0 && e.done < e.total;
        const countTag = e.total > 1 ? ` <span style="color:var(--txt3);font-size:0.7rem;margin-left:4px;">x${e.total}</span>` : '';
        const mark = fullyDone
          ? ' <span style="color:var(--green);font-weight:bold;margin-left:4px;">✓</span>'
          : partial
            ? ` <span style="color:var(--txt3);font-size:0.7rem;margin-left:4px;">${e.done}/${e.total}</span>`
            : '';
        return `<div class="tt-date-item">${e.date}${countTag}${mark}</div>`;
      }).join('');
      if (hiddenDates > 0) {
        html += `<div class="tt-date-item" style="color:var(--txt3);font-size:0.7rem;border-top:1px dashed var(--border2);padding-top:3px;margin-top:3px;">⋯其他 ${hiddenDates} 天超出 ±3 週</div>`;
      }
      ttDates.innerHTML = html;
    }
  }
  
  ttEl.classList.add('open');
  const rect = cardEl.getBoundingClientRect();
  ttEl.style.left = `${rect.right + 10}px`;
  ttEl.style.top = `${rect.top}px`;
  
  // Adjust if offscreen
  setTimeout(() => {
    const ttRect = ttEl.getBoundingClientRect();
    if (ttRect.right > window.innerWidth) {
      ttEl.style.left = `${rect.left - ttRect.width - 10}px`;
    }
    if (ttRect.bottom > window.innerHeight) {
      ttEl.style.top = `${Math.max(10, window.innerHeight - ttRect.height - 10)}px`;
    }
  }, 0);
}

function hideTaskTooltip() {
  if (ttEl) ttEl.classList.remove('open');
}

/* ══════════════════════════════════════════════
   POOL REORDER LOGIC
══════════════════════════════════════════════ */
async function reorderPoolTask(draggedTask, targetCat, targetTplId, isAfter) {
  if (!draggedTask.templateId) return;

  // Find all templates in the target category
  const targetTpls = taskTemplates.filter(t => t.category === targetCat).sort((a,b) => {
    const oa = a.order !== undefined ? a.order : 999;
    const ob = b.order !== undefined ? b.order : 999;
    return oa - ob;
  });
  
  const draggedTpl = taskTemplates.find(t => t.id === draggedTask.templateId);
  if (!draggedTpl) return;
  
  const filteredTpls = targetTpls.filter(t => t.id !== draggedTask.templateId);
  
  let insertIdx = 0;
  if (targetTplId) {
    const refIdx = filteredTpls.findIndex(t => t.id === targetTplId);
    if (refIdx !== -1) {
      insertIdx = isAfter ? refIdx + 1 : refIdx;
    }
  } else {
    insertIdx = 0;
  }
  
  filteredTpls.splice(insertIdx, 0, draggedTpl);
  
  const batch = writeBatch(db);
  let orderCounter = 0;
  filteredTpls.forEach(t => {
    batch.update(doc(db, "templates", t.id), { order: orderCounter, category: targetCat });
    orderCounter++;
  });

  await batch.commit();
}

/* ══════════════════════════════════════════════
   NOTE POPOVER LOGIC
══════════════════════════════════════════════ */
const npPopover = $('note-popover');
const npText = $('np-text');
let currentNoteTaskId = null;

function openNotePopover(task, iconEl) {
  currentNoteTaskId = task.id;
  npText.value = task.note || '';
  
  const rect = iconEl.getBoundingClientRect();
  npPopover.style.left = `${rect.right + 10}px`;
  npPopover.style.top = `${rect.top}px`;
  
  // Adjust if it goes offscreen
  npPopover.classList.add('open');
  const popRect = npPopover.getBoundingClientRect();
  if (popRect.right > window.innerWidth) {
    npPopover.style.left = `${rect.left - popRect.width - 10}px`;
  }
  if (popRect.bottom > window.innerHeight) {
    npPopover.style.top = `${window.innerHeight - popRect.height - 10}px`;
  }
  npText.focus();
}

$('np-cancel').addEventListener('click', () => {
  npPopover.classList.remove('open');
  currentNoteTaskId = null;
});

$('np-save').addEventListener('click', async () => {
  if (currentNoteTaskId) {
    const noteVal = npText.value;

    // Find the source task to determine templateId / name
    let srcTask = scheduledTasks.find(t => t.id === currentNoteTaskId);
    if (!srcTask) {
      for (const mk of Object.keys(poolTasksByMonth)) {
        const found = poolTasksByMonth[mk].find(t => t.id === currentNoteTaskId);
        if (found) { srcTask = found; break; }
      }
    }

    // Collect all task ids that should share this note
    const idsToUpdate = new Set([currentNoteTaskId]);
    if (srcTask) {
      const sameTask = (t) => srcTask.templateId
        ? t.templateId === srcTask.templateId
        : (!t.templateId && t.name === srcTask.name);

      scheduledTasks.forEach(t => { if (sameTask(t)) idsToUpdate.add(t.id); });
      Object.keys(poolTasksByMonth).forEach(mk => {
        poolTasksByMonth[mk].forEach(t => { if (sameTask(t)) idsToUpdate.add(t.id); });
      });
    }

    // Batch update — chunk every 400 ops to stay under Firestore's 500 limit
    const ids = Array.from(idsToUpdate);
    const batches = [];
    let batch = writeBatch(db);
    let opCount = 0;
    ids.forEach(id => {
      batch.update(doc(db, "tasks", id), { note: noteVal });
      opCount++;
      if (opCount === 400) { batches.push(batch); batch = writeBatch(db); opCount = 0; }
    });
    if (opCount > 0) batches.push(batch);
    for (const b of batches) await b.commit();
  }
  npPopover.classList.remove('open');
  currentNoteTaskId = null;
});

// Close popover when clicking outside
document.addEventListener('click', (e) => {
  if (npPopover.classList.contains('open') && !npPopover.contains(e.target) && !e.target.closest('.note-icon')) {
    npPopover.classList.remove('open');
  }
  if (!e.target.closest('.multi-select-container')) {
    document.querySelectorAll('.multi-select-container.open').forEach(c => c.classList.remove('open'));
  }
});

/* ══════════════════════════════════════════════
   SIDEBAR TABS & SHIFT DATA LOGIC
══════════════════════════════════════════════ */
const tabContentPool = $('tab-content-pool');
const tabContentShift = $('tab-content-shift');
const sTabs = document.querySelectorAll('.s-tab');
const shiftDatePicker = $('shift-date');
const shiftRowsContainer = $('shift-rows-container');

let currentShiftData = {};

sTabs.forEach(tab => {
  tab.addEventListener('click', () => {
    sTabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.dataset.tab;
    if (target === 'pool') {
      tabContentPool.style.display = 'flex';
      tabContentShift.style.display = 'none';
      editToggleBtn.style.display = 'block';
    } else {
      tabContentPool.style.display = 'none';
      tabContentShift.style.display = 'flex';
      editToggleBtn.style.display = 'none';
      if (!currentShiftDate) {
        currentShiftDate = fmtDate(REAL_TODAY);
        shiftDatePicker.value = currentShiftDate;
        loadShiftData(currentShiftDate);
      }
    }
  });
});

shiftDatePicker.addEventListener('change', (e) => {
  if (e.target.value) {
    currentShiftDate = e.target.value;
    loadShiftData(currentShiftDate);
  }
});

$('prev-shift-date').addEventListener('click', () => {
  if (!shiftDatePicker.value) return;
  const d = new Date(shiftDatePicker.value);
  d.setDate(d.getDate() - 1);
  shiftDatePicker.value = d.toISOString().split('T')[0];
  shiftDatePicker.dispatchEvent(new Event('change'));
});

$('next-shift-date').addEventListener('click', () => {
  if (!shiftDatePicker.value) return;
  const d = new Date(shiftDatePicker.value);
  d.setDate(d.getDate() + 1);
  shiftDatePicker.value = d.toISOString().split('T')[0];
  shiftDatePicker.dispatchEvent(new Event('change'));
});

function loadShiftData(dateStr) {
  if (shiftUnsubscribe) shiftUnsubscribe();
  shiftUnsubscribe = onSnapshot(doc(db, "shifts", dateStr), (dSnap) => {
    if (dSnap.exists()) {
      currentShiftData = dSnap.data();
    } else {
      currentShiftData = {};
    }
    renderShiftRows();
  });
}

let draggedMainShiftRoleIdx = null;

function renderShiftRows() {
  shiftRowsContainer.innerHTML = '';
  shiftRoles.forEach((role, index) => {
    const row = document.createElement('div');
    row.className = 'shift-row';
    row.dataset.role = role;
    row.draggable = true;
    row.style.cursor = 'grab';
    
    row.addEventListener('dragstart', (e) => {
      // 防止在下拉選單內拖曳
      if (e.target.closest('.multi-select-container')) {
        e.preventDefault();
        return;
      }
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', index);
      draggedMainShiftRoleIdx = index;
      setTimeout(() => row.style.opacity = '0.5', 0);
    });
    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      row.style.borderTop = '2px solid var(--blue)';
    });
    row.addEventListener('dragleave', () => {
      row.style.borderTop = '';
    });
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      row.style.borderTop = '';
      if (draggedMainShiftRoleIdx !== null && draggedMainShiftRoleIdx !== index) {
        const movedRole = shiftRoles[draggedMainShiftRoleIdx];
        const refRole = shiftRoles[index];
        mutateSettingsArray('shiftRoles', arr => {
          const i = arr.indexOf(movedRole);
          if (i === -1) return arr;
          arr.splice(i, 1);
          const refIdx = arr.indexOf(refRole);
          arr.splice(refIdx === -1 ? arr.length : refIdx, 0, movedRole);
          return arr;
        });
      }
    });
    row.addEventListener('dragend', () => {
      row.style.opacity = '1';
      draggedMainShiftRoleIdx = null;
    });

    const lbl = document.createElement('div');
    lbl.className = 'shift-row-label';
    lbl.textContent = role;
    
    const divi = document.createElement('div');
    divi.className = 'shift-row-divider';
    divi.textContent = '|';
    
    const container = document.createElement('div');
    container.className = 'multi-select-container';
    
    const trigger = document.createElement('div');
    trigger.className = 'multi-select-trigger';
    
    const dropdown = document.createElement('div');
    dropdown.className = 'multi-select-dropdown';
    
    const valStr = currentShiftData[role] || (role === '11AM AB廁所' ? currentShiftData['11AM 廁所'] : "");
    let selectedEmps = valStr ? valStr.split(',').map(s => s.trim()).filter(Boolean) : [];
    
    const updateTriggerText = () => {
      trigger.innerHTML = `<span>${selectedEmps.length > 0 ? selectedEmps.join(', ') : '<span style="color:var(--txt3)">【是誰啊】</span>'}</span>
                           <span style="color:var(--txt3);font-size:0.7rem;">▼</span>`;
    };
    updateTriggerText();
    
    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.multi-select-container.open').forEach(c => {
        if (c !== container) c.classList.remove('open');
      });
      container.classList.toggle('open');
    });
    
    employees.forEach(emp => {
      const opt = document.createElement('div');
      opt.className = 'multi-select-option' + (selectedEmps.includes(emp) ? ' selected' : '');
      opt.innerHTML = `<span>${emp}</span><span>${selectedEmps.includes(emp) ? '✓' : ''}</span>`;
      
      opt.addEventListener('click', (e) => {
        e.stopPropagation();
        if (selectedEmps.includes(emp)) {
          selectedEmps = selectedEmps.filter(e => e !== emp);
          opt.classList.remove('selected');
          opt.innerHTML = `<span>${emp}</span><span></span>`;
        } else {
          selectedEmps.push(emp);
          opt.classList.add('selected');
          opt.innerHTML = `<span>${emp}</span><span>✓</span>`;
        }
        updateTriggerText();
        updateShiftRole(role, selectedEmps.join(', '));
      });
      dropdown.appendChild(opt);
    });
    
    container.appendChild(trigger);
    container.appendChild(dropdown);
    
    row.appendChild(lbl);
    row.appendChild(divi);
    row.appendChild(container);
    shiftRowsContainer.appendChild(row);
  });
}

const empModalOverlay = $('emp-modal-overlay');
const empListEl = $('emp-list');
const newEmpNameInput = $('new-emp-name');

// ━━━━ SHIFT ROLE MANAGEMENT ━━━━
const shiftRoleModalOverlay = $('shift-role-modal-overlay');
const shiftRoleListEl = $('shift-role-list');
const newShiftRoleNameInput = $('new-shift-role-name');
let draggedShiftRoleIdx = null;

function renderShiftRoleList() {

    const row = document.createElement('div');

    nameSpan.style.flex = '1';
    
    const actions = document.createElement('div');
    actions.style.display = 'flex';
    actions.style.gap = '4px';

    row.addEventListener('dragstart', (e) => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', index);
      draggedShiftRoleIdx = index;
      setTimeout(() => row.style.opacity = '0.5', 0);
    });
    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      row.style.borderTop = '2px solid var(--blue)';
    });
    row.addEventListener('dragleave', () => {
      row.style.borderTop = '';
    });
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      row.style.borderTop = '';
      if (draggedShiftRoleIdx !== null && draggedShiftRoleIdx !== index) {
        const movedRole = shiftRoles[draggedShiftRoleIdx];
        const refRole = shiftRoles[index];
        mutateSettingsArray('shiftRoles', arr => {
          const i = arr.indexOf(movedRole);
          if (i === -1) return arr;
          arr.splice(i, 1);
          const refIdx = arr.indexOf(refRole);
          arr.splice(refIdx === -1 ? arr.length : refIdx, 0, movedRole);
          return arr;
        });
      }
    });
    row.addEventListener('dragend', () => {
      row.style.opacity = '1';
      draggedShiftRoleIdx = null;
    });

    const editBtn = document.createElement('button');
    editBtn.innerHTML = '✏️';
    editBtn.style.cssText = 'background:transparent; border:none; cursor:pointer; font-size:.75rem; filter: grayscale(1); transition: filter 0.2s;';
    editBtn.onmouseover = () => editBtn.style.filter = 'grayscale(0)';
    editBtn.onmouseout = () => editBtn.style.filter = 'grayscale(1)';

    const delBtn = document.createElement('button');
    delBtn.innerHTML = '✕';
    delBtn.style.cssText = 'background:transparent; border:none; color:var(--txt3); cursor:pointer; font-size:.8rem; transition:color 0.2s;';
    delBtn.onmouseover = () => delBtn.style.color = 'var(--red)';
    delBtn.onmouseout = () => delBtn.style.color = 'var(--txt3)';

    editBtn.onclick = () => {
      sysPrompt('請輸入新的班表項目名稱：', role, (newName) => {
        if (newName !== null) {
          const trimmed = newName.trim();
          if (trimmed && trimmed !== role && !shiftRoles.includes(trimmed)) {
            mutateSettingsArray('shiftRoles', arr => arr.map(r => r === role ? trimmed : r));
            setTimeout(renderShiftRoleList, 100);
          }
        }
      });
    };

    delBtn.onclick = () => {
      sysConfirm(`確定要刪除項目「${role}」嗎？這不會刪除過去已經排好的紀錄，但未來將無法再排此項目。`, () => {
        removeFromSettingsArray('shiftRoles', role);
        setTimeout(renderShiftRoleList, 100);
      });
    };
    
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    row.appendChild(nameSpan);
    row.appendChild(actions);
    shiftRoleListEl.appendChild(row);
  });
}

$('manage-shift-role-btn').addEventListener('click', () => {
  newShiftRoleNameInput.value = '';
  renderShiftRoleList();
  shiftRoleModalOverlay.classList.add('open');
});

$('add-new-shift-role-btn').addEventListener('click', () => {
  const name = newShiftRoleNameInput.value.trim();
  if (name && !shiftRoles.includes(name)) {
    addToSettingsArray('shiftRoles', name);
    newShiftRoleNameInput.value = '';
    setTimeout(renderShiftRoleList, 100);
  }
});
newShiftRoleNameInput.addEventListener('keydown', e => { if(e.key==='Enter') $('add-new-shift-role-btn').click(); });

$('shift-role-m-close').addEventListener('click', () => {
  shiftRoleModalOverlay.classList.remove('open');
});

$('manage-emp-btn').addEventListener('click', () => {
  if (typeof renderEmpList === 'function') renderEmpList();
  empModalOverlay.classList.add('open');
  setTimeout(()=>newEmpNameInput.focus(), 60);
});

$('emp-m-close').addEventListener('click', () => {
  empModalOverlay.classList.remove('open');
});

$('emp-restore-btn').addEventListener('click', () => {
  const backup = readSettingsBackup();
  if (!backup || (!backup.employees && !backup.shiftRoles && !backup.categories)) {
    sysAlert('本機沒有可用的備份。');
    return;
  }
  const empCount = Array.isArray(backup.employees) ? backup.employees.length : 0;
  const roleCount = Array.isArray(backup.shiftRoles) ? backup.shiftRoles.length : 0;
  const savedAt = backup.savedAt ? new Date(backup.savedAt).toLocaleString('zh-TW', { hour12: false }) : '未知時間';
  sysConfirm(
    `將從本機備份還原以下資料到雲端：\n` +
    `・員工 ${empCount} 筆\n` +
    `・班表項目 ${roleCount} 筆\n` +
    `（備份時間：${savedAt}）\n\n` +
    `雲端目前若有不在備份內的項目會被一併保留。確定要還原嗎？`,
    () => { restoreSettingsFromBackup(); }
  );
});

empModalOverlay.addEventListener('click', e => { 
  if (e.target === empModalOverlay) empModalOverlay.classList.remove('open'); 
});

$('add-emp-btn').addEventListener('click', () => {
  const name = newEmpNameInput.value.trim();
  if (!name) return;
  if (!employees.includes(name)) {
    addToSettingsArray('employees', name);
  }
  newEmpNameInput.value = '';
  newEmpNameInput.focus();
});

newEmpNameInput.addEventListener('keydown', e => { if (e.key === 'Enter') $('add-emp-btn').click(); });

function renderEmpList() {
  if (!empListEl) return;
  empListEl.innerHTML = '';
  if (employees.length === 0) {
    empListEl.innerHTML = '<div style="color:var(--txt3); font-size:.8rem; padding:4px;">尚無員工，請從上方新增</div>';
    return;
  }
  employees.forEach(emp => {
    const item = document.createElement('div');
    item.className = 'emp-item';
    
    const nameSpan = document.createElement('span');
    nameSpan.textContent = emp;
    
    const delBtn = document.createElement('span');
    delBtn.className = 'emp-item-del';
    delBtn.textContent = '✕';
    delBtn.title = '刪除員工';
    delBtn.addEventListener('click', () => {
      sysConfirm(`確定要刪除員工「${emp}」嗎？`, () => {
        removeFromSettingsArray('employees', emp);
      });
    });
    
    item.appendChild(nameSpan);
    item.appendChild(delBtn);
    empListEl.appendChild(item);
  });
}

function updateShiftRole(role, empName) {
  if (!currentShiftDate) return;
  const docRef = doc(db, "shifts", currentShiftDate);
  const updateData = {};
  updateData[role] = empName;
  
  setDoc(docRef, updateData, { merge: true }).catch(err => {
    console.error("更新班表失敗:", err);
  });
}
