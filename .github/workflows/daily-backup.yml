name: 每日自動備份 Firestore

# Firestore 免費方案配額每天美西時間午夜重置
# 故排在配額剛重置後（UTC 08:00 / 太平洋時間 00:00 / 台灣時間 16:00）
# 此時讀取配額最充裕，備份最不易碰到 429
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 從 secret 還原 service account
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::缺少 GitHub Secret: FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          # debug：驗證 JSON 可解析、能拿到 project_id（不會印敏感欄位）
          echo "--- SA file info ---"
          ls -la "$RUNNER_TEMP/sa.json"
          echo "First 50 chars: $(head -c 50 "$RUNNER_TEMP/sa.json")"
          node -e "try { const sa = JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/sa.json','utf8')); console.log('✓ JSON valid'); console.log('project_id:', sa.project_id); console.log('client_email:', sa.client_email); console.log('private_key_id:', sa.private_key_id ? sa.private_key_id.slice(0,8)+'...' : 'MISSING'); console.log('private_key starts with:', sa.private_key ? sa.private_key.slice(0,30) : 'MISSING'); } catch (e) { console.error('✗ JSON parse failed:', e.message); process.exit(1); }"

      - name: 抓 Firestore 全部資料 → JSON
        run: node .github/scripts/firestore-backup.mjs

      - name: 推到 backups 分支
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 把備份檔先暫存出去（避免被 checkout/clean 清掉）
          cp -r backup-out "$RUNNER_TEMP/backup-out"

          if git ls-remote --exit-code --heads origin backups >/dev/null 2>&1; then
            echo "backups 分支已存在，checkout"
            git fetch origin backups --depth=1
            git checkout backups
          else
            echo "backups 分支不存在，建立 orphan 分支"
            git checkout --orphan backups
            git reset --hard
            echo "# Firestore daily backups" > README.md
            git add README.md
            git commit -m "init backups branch"
          fi

          mkdir -p daily
          cp "$RUNNER_TEMP/backup-out/"backup-*.json daily/ 2>/dev/null || true
          cp "$RUNNER_TEMP/backup-out/latest.json" latest.json

          # 只留最近 60 個每日檔
          ls -t daily/backup-*.json 2>/dev/null | tail -n +61 | xargs -r rm

          git add daily/ latest.json
          if git diff --cached --quiet; then
            echo "沒有變更，跳過 commit"
          else
            git commit -m "backup $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin backups
          fi
